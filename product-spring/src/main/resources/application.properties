spring.application.name=product-spring

# Mybatis 설정
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.type-aliases-package=com.product.product_spring.dto
mybatis.mapper-locations=classpath*:com/product/product_spring/mapper/*.xml

# 로그레벨
logging.level.root=DEBUG
logging.level.com.product.product_spring=DEBUG

# 파일 업로드 설정
# 파일 용량
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB
# 파일 업로드 임시 경로
spring.servlet.multipart.location=C:/upload/temp
upload.path=C:/upload

# application.properties — DB 연결 및 MyBatis 설정
spring.datasource.url=jdbc:mysql://localhost:3306/aloha?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul
spring.datasource.username=root
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
